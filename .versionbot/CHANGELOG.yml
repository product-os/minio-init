    - subject: Pin ansible-core and drop unused dependencies
      hash: a9c34ff229a768fb2e5a8d099181d61c6fbdd160
      body: |
        Install ansible-core from requirements.txt instead of the full ansible
        package. The role uses only ansible.builtin modules, so the bundled
        collections never load. The unpinned bundle is also what delivered the
        community.general callback removal on rebuild.

        Drop boto3 and the amazon.aws and ansible.posix collections. No task
        references them. collections_path in ansible.cfg also excludes the
        galaxy install directory, so Ansible could not load the collections.
      footer:
        Change-type: minor
        change-type: minor
        Signed-off-by: Kyle Harding <kyle@balena.io>
        signed-off-by: Kyle Harding <kyle@balena.io>
      author: Kyle Harding
      nested: []
    - subject: Replace the removed community.general.yaml callback
      hash: 97c6ff54c38517c8820a30a21cfd2252cbf79883
      body: |
        community.general 12.0.0 removed the yaml stdout callback. Use the
        default callback with YAML result formatting instead.

        The ini key is callback_result_format, not result_format -- the latter
        is the plugin option name and is silently ignored in ansible.cfg.
      footer:
        Change-type: patch
        change-type: patch
        Signed-off-by: Kyle Harding <kyle@balena.io>
        signed-off-by: Kyle Harding <kyle@balena.io>
      author: Kyle Harding
      nested: []
